# Bo header bao mat dung chung cho moi server block / location.
#
# LY DO TON TAI: trong nginx, `add_header` o mot block con se GHI DE HOAN TOAN
# (khong cong don) cac `add_header` o block cha. Neu khai bao header bao mat o
# server level, chi mot `add_header` rieng trong location du nhat (vi du
# Cache-Control) cung lam mat toan bo header con lai trong response do --
# tuc la HSTS, X-Frame-Options... bien mat mot cach am tham.
#
# Dung cach nay: file nay la noi dung dung chung, `include` o moi noi can.
# Khi them header moi, chi sua file nay, khong phai sua nhieu cho.
#
# `always` bat buoc: response loi (4xx/5xx) cung phai co header bao mat,
# neu khong trinh duyet se bo qua header o response thanh cong.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# X-XSS-Protection da bi cac trinh duyet hien dai bo qua (Chromium 78+)
# va thuoc lo cau hinh, nhung giu lai de tuong thich trinh duyet cu.
add_header X-XSS-Protection "1; mode=block" always;

# HSTS chi co hieu luc tren HTTPS, nen chi dat o server block 443.
# Cloudflare "Full (strict)" da tu them HSTS o phia may chu cua no,
# nhung dat them o day de bao dam ke ca khi truy cap truc tiep vao origin.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
