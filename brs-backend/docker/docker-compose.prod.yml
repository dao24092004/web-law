# ============================================================
# BRS Production Stack
# PostgreSQL + Redis + Backend (Spring Boot) + Frontend (Next.js) + Nginx
#
# RabbitMQ đã được loại bỏ (config-only, không có consumer/producer code).
#
# Giới hạn tài nguyên dựa trên phép đo thực tế:
#   idle ~692 MB RAM · tải 300 người dùng đồng thời (134 req/s) ~760 MB RAM
# Xem benchmark/BAO-CAO-TAI-NGUON.md
# ============================================================

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: brs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-brs}
      POSTGRES_USER: ${DB_USER:-brs_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-brs_user} -d ${DB_NAME:-brs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Redis Cache (OTP, refresh-token, lockout, view-count, cache)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: brs-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.25"
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Backend (Spring Boot 3.3 / Java 21)
  # Đo được: idle 604 MB · tải cao 640 MB · 0.4 core
  # ============================================================
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: brs-backend:latest
    container_name: brs-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-brs}
      DB_USER: ${DB_USER:-brs_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      UPLOAD_DIR: /app/uploads
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}
      # Secret riêng cho từng webhook. Bắt buộc phải đặt, nếu để trống thì
      # endpoint webhook từ chối mọi request (fail-closed).
      WEBHOOKS_SMS_SECRET: ${WEBHOOKS_SMS_SECRET:?WEBHOOKS_SMS_SECRET must be set}
      WEBHOOKS_OTP_SECRET: ${WEBHOOKS_OTP_SECRET:?WEBHOOKS_OTP_SECRET must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGIN_1: ${CORS_ORIGIN_1:-https://${DOMAIN}}
      CORS_ORIGIN_2: ${CORS_ORIGIN_2:-https://www.${DOMAIN}}
      CORS_ORIGIN_3: ${CORS_ORIGIN_3:-https://admin.${DOMAIN}}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # JVM tự tính heap theo giới hạn bộ nhớ của container.
      # Giữ ở 70% để chừa chỗ cho metaspace, thread stack và direct buffer.
      JAVA_OPTS: "-XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=25.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    volumes:
      # File key phải để mode 644: container chạy uid 100, nếu key là 600/uid 1000
      # thì app im lặng tạm key và token hỏng mỗi lần restart.
      - ./keys/jwt-private.pem:/app/keys/jwt-private.pem:ro
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Cho đủ thời gian để Spring Boot đóng connection và flush buffer.
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.50"
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================
  # Frontend (Next.js standalone)
  # Đo được: idle 50 MB · SSR 200 request đồng thời ~114 MB
  # ============================================================
  frontend:
    build:
      context: ../../frontend/vp-luat
      dockerfile: Dockerfile
    image: brs-frontend:latest
    container_name: brs-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.${DOMAIN}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN}}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # NextAuth/Auth.js: container chay NODE_ENV=production nen nhanh
      # `trustHost` mac dinh false va se trai UntrustedHost cho MOI request
      # (ke ca request qua Cloudflare). Phai bat no khi co reverse proxy
      # tin cay phia truoc.
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN}}
      # Secret dung ky cookie session. Bat buoc: neu thieu, Auth.js bao loi
      # MissingSecret va khong tao duoc session.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
    healthcheck:
      # 127.0.0.1 chứ không phải "localhost": trong container "localhost" có thể
      # resolve ra IPv6 ::1, còn next-server chỉ bind IPv4 0.0.0.0.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: brs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # File header bao mat dung chung, noi dung trong nginx.conf
      # include no. Neu thieu mount, nginx fail khi khoi dong.
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    # Mặc định nginx chỉ mở 1024 file, thấp hơn worker_connections trong
    # nginx.conf. Nới ra để tránh cảnh báo và giới hạn kết nối thực tế.
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.50"
    networks:
      - brs-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_logs:
  nginx_cache:

networks:
  brs-internal:
    driver: bridge
