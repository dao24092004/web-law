# ============================================================
# Production Profile Configuration
# ============================================================

spring:
  # Production Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:brs}
    username: ${DB_USER:brs_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Redis (Production)
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5

  # RabbitMQ (Production)
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /

  # Hide SQL in production
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Flyway - production settings
  flyway:
    baseline-on-migrate: false

# Production-specific app config
app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    key: ${APP_SEED_KEY:initial-content-v1}
    mode: ${APP_SEED_MODE:IF_EMPTY}
    admin-email: ${APP_SEED_ADMIN_EMAIL:}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}
    admin-name: ${APP_SEED_ADMIN_NAME:Quan tri vien}
    admin-phone: ${APP_SEED_ADMIN_PHONE:}
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:/run/secrets/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/run/secrets/jwt-public.pem}

  cors:
    allowed-origins:
      - ${CORS_ORIGIN_1:https://lawfirm.vn}
      - ${CORS_ORIGIN_2:https://www.lawfirm.vn}
      - ${CORS_ORIGIN_3:https://admin.lawfirm.vn}

# Logging - production
logging:
  level:
    root: WARN
    com.lawfirm.brs: INFO
    org.springframework.security: WARN
  file:
    name: /var/log/brs/brs-backend.log

# Swagger UI - disabled in production
# api-docs phải tắt RIÊNG: nó là property khác với swagger-ui.enabled.
# Nếu chỉ tắt swagger-ui thì /v3/api-docs vẫn trả về toàn bộ schema của
# hệ thống cho bất kỳ ai, tiết lộ endpoint, tên trường và cấu trúc dữ liệu.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Actuator - production
management:
  endpoints:
    web:
      exposure:
        # Chỉ còn health/info. metrics và prometheus lộ số liệu vận hành
        # (số kết nối, bộ nhớ, tên cache) cho bất kỳ tài khoản nào đã đăng nhập.
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # docker-compose.prod.yml khong chay RabbitMQ, nen phai tat health
    # indicator; neu bat, actuator/health luon DOWN va container healthy
    # check that -> khong bao gio len duoc, lam nginx khong start.
    rabbit:
      enabled: false
    # SMTP tre la dependency ben ngoai. Mat SMTP khong nen lam DOWN toan bo
    # health endpoint, neu lai health check -> container healthy check that
    # -> nginx khong start. Neu can canh bao SMTP, nen dung alert rieng
    # tren log thay vi dua vao actuator health.
    mail:
      enabled: false
